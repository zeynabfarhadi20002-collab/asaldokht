---
layout: default
---
<article dir="rtl" class="bg-white border border-amber-500/10 rounded-3xl p-6 md:p-10 shadow-sm space-y-6 text-right"> 
    <div class="space-y-3 border-b border-stone-100 pb-6">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-50 text-[11px] font-bold text-amber-950">
            <i class="fa-solid fa-book-open text-amber-600"></i> مقاله‌ی آموزشی سالن عسل دخت
        </div>
        <h1 class="text-2xl md:text-4xl font-black text-amber-900 leading-tight">
            {{ page.title }}
        </h1>
        <p class="text-stone-400 text-xs flex items-center gap-1 pt-1">
            <i class="fa-solid fa-calendar-days"></i> تاریخ انتشار: {{ page.date | date: "%Y/%m/%d" }}
        </p>
    </div>
    
    <div class="text-stone-700 text-sm md:text-base leading-loose space-y-4 text-right font-normal">
        {{ content }}
    </div>

    <div class="pt-8 border-t border-dashed border-stone-200 flex justify-between items-center flex-wrap gap-4">
        <a href="/blog.html" class="text-xs font-bold text-stone-800 bg-stone-100 hover:bg-stone-200 px-4 py-2.5 rounded-full transition-all flex items-center gap-1">
            <i class="fa-solid fa-arrow-right"></i> بازگشت به لیست مقالات
        </a>
        <a href="/#booking" class="text-xs font-bold text-amber-800 hover:text-amber-950 flex items-center gap-1">
            نیاز به مشاوره تخصصی دارید؟ مشاوره و رزرو نوبت <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </a>
    </div>
</article>
