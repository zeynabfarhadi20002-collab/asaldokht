<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="سالن زیبایی عسل دخت در اراک، ارائه دهنده برترین خدمات زیبایی و آرایشی با نازل‌ترین قیمت.">
    <title>سالن زیبایی عسل دخت | خدمات زیبایی در اراک</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; padding: 0; background-color: #fdf6f7; color: #333; }
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 2px solid #f8e1e1; }
        header img { width: 150px; }
        .hero { padding: 60px 20px; text-align: center; background: linear-gradient(135deg, #f8e1e1, #fff); }
        .hero h1 { color: #d63384; }
        .services { display: flex; flex-wrap: wrap; justify-content: center; padding: 40px 20px; }
        .service-card { background: #fff; border-radius: 15px; padding: 20px; margin: 15px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .price-tag { color: #d63384; font-weight: bold; font-size: 1.2em; display: block; margin-top: 10px; }
        footer { background: #333; color: #fff; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="لوگوی عسل دخت">
</header>

<section class="hero">
    <h1>سالن زیبایی عسل دخت در اراک</h1>
    <p>زیبایی و درخشش در قلب اراک</p>
    <img src="hero.jpg" alt="نمونه کار سالن" style="width: 100%; max-width: 600px; border-radius: 15px;">
</section>

<section class="services">
    <div class="service-card">
        <h3>رنگ و لایت</h3>
        <p>خدمات تخصصی رنگ مو</p>
        <span class="price-tag">با نازل‌ترین قیمت</span>
    </div>
    <div class="service-card">
        <h3>میکاپ تخصصی</h3>
        <p>میکاپ حرفه‌ای برای مجالس</p>
        <span class="price-tag">با نازل‌ترین قیمت</span>
    </div>
    <div class="service-card">
        <h3>خدمات مراقبتی</h3>
        <p>پوست و زیبایی با ظرافت</p>
        <span class="price-tag">با نازل‌ترین قیمت</span>
    </div>
</section>

<footer>
    <p>آدرس: اراک، [آدرس خود را اینجا بنویس]</p>
    <p>تلفن: [شماره تماس را اینجا بنویس]</p>
</footer>

</body>
</html>
